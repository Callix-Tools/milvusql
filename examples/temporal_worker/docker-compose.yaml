name: milvus-examples

include:
  - ../../example_infra/milvus.compose.yml

services:
  temporal:
    image: temporalio/temporal:latest
    container_name: temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --namespace=default
      - --log-level=warn
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
