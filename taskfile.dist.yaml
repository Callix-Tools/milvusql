version: "3"

tasks:
  install:
    desc: Install all workspace dependencies including sub-package groups
    cmds:
      - uv sync --all-groups --all-packages

  lint:
    desc: Run linters for the whole workspace (core + packages/*)
    vars:
      LINT_PATHS: src tests packages/milvusql-sqlalchemy/src packages/milvusql-sqlalchemy/tests packages/milvusql-django/src packages/milvusql-django/tests
    cmds:
      - |
        # NOTE: `if: ... / cmd: ...` list-item pairs are not a real Task
        # conditional (Task silently ignores an unrecognized `if:` key and
        # always runs `cmd:`) -- branching lives in plain shell instead,
        # driven by the real `$CI` env var GitHub Actions itself sets.
        if [[ -n "$CI" ]]; then
          mkdir -p reports
        else
          uv run ruff format {{.LINT_PATHS}}
        fi
      - |
        uv run ruff check \
          {{ if eq (env "CI") "true" -}}
          --output-format json --output-file reports/ruff.json \
          {{ else -}}
          --fix \
          {{ end -}}
          {{.LINT_PATHS}}
      - |
        uv run bandit -r src packages/milvusql-sqlalchemy/src packages/milvusql-django/src{{ if eq (env "CI") "true" }} \
          -o reports/bandit.json --format json{{ end }}
      - |
        uv run ty check{{ if eq (env "CI") "true" }} \
          --output-format gitlab > reports/gl-code-quality-report.json{{ end }}

  tests:
    desc: >-
      Run tests for the whole workspace (use COVERAGE=true for reports).
      Pass args after `--` to target a specific path/pattern directly, e.g.
      `task tests -- tests/unit/errors -k grpc` -- that bypasses the
      per-package split below and runs one plain pytest invocation instead.
    vars:
      # Each package gets its OWN pytest invocation (own rootdir), not one
      # combined `pytest tests packages/*/tests` call: the entity/action
      # test layout needs `__init__.py` all the way down for pytest to tell
      # same-named act.py/error.py files apart, and three same-named `tests`
      # packages collected in one process collide
      # (`ImportPathMismatchError` -- confirmed directly). Coverage from the
      # three separate runs is merged back into one report afterward.
      PACKAGE_ROOTS: "milvusql:tests milvusql-sqlalchemy:packages/milvusql-sqlalchemy/tests milvusql-django:packages/milvusql-django/tests"
    cmds:
      - |
        set -uo pipefail
        if [[ -n "${CI:-}" ]]; then
          mkdir -p reports
        fi

        # One consolidated script, not several `cmds:` steps: Task runs every
        # `cmds:` entry regardless of what an earlier one's shell process
        # `exit`-ed with (confirmed directly) -- only a *non-zero* exit stops
        # the task early, so branching between "direct mode" and "the
        # per-package loop + combine" has to live inside one script.
        if [[ -n "{{.CLI_ARGS}}" ]]; then
          exec uv run pytest \
            -n {{.CONCURRENCY | default "auto"}} \
            -m "not validation" \
            {{ if .SEED -}}
            --randomly-seed={{.SEED}} \
            {{ end -}}
            {{ if eq .FAILFAST "true" -}}
            -x \
            {{ end -}}
            {{.CLI_ARGS}}
        fi

        # Every package runs even if an earlier one fails -- one bad package
        # shouldn't hide the other two's results in the same CI log -- but
        # the task still exits non-zero overall if any of them did.
        failed=0
        for pkg_root in {{.PACKAGE_ROOTS}}; do
          pkg="${pkg_root%%:*}"
          path="${pkg_root#*:}"
          COVERAGE_FILE="reports/.coverage.${pkg}" \
          uv run pytest \
            -n {{.CONCURRENCY | default "auto"}} \
            -m "not validation" \
            {{ if eq .COVERAGE "true" -}}
            --cov=src --cov=packages/milvusql-sqlalchemy/src --cov=packages/milvusql-django/src \
            --cov-report= \
            --junitxml="reports/junit-${pkg}.xml" \
            {{ end -}}
            {{ if .SEED -}}
            --randomly-seed={{.SEED}} \
            {{ end -}}
            {{ if eq .FAILFAST "true" -}}
            -x \
            {{ end -}}
            "$path" || failed=1
        done

        {{ if eq .COVERAGE "true" -}}
        uv run coverage combine reports/.coverage.milvusql reports/.coverage.milvusql-sqlalchemy reports/.coverage.milvusql-django
        uv run coverage xml -o reports/coverage.xml
        uv run coverage report --skip-covered
        {{ end -}}

        exit "$failed"

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:version:
    desc: Determine next version via conventional commits
    cmds:
      - |
        NEXT=$(git cliff --bumped-version 2>/dev/null || echo "")
        if [[ -z "$NEXT" ]]; then
          echo "No previous tag found, bootstrapping with v0.1.0"
          NEXT="v0.1.0"
        fi
        NEXT_CLEAN="${NEXT#v}"
        echo "Next version: $NEXT ($NEXT_CLEAN)"
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_CLEAN" >> "$GITHUB_OUTPUT"
        fi

  release:bump:
    desc: Bump version in all packages (requires VERSION=x.y.z)
    requires:
      vars: [VERSION]
    cmds:
      - uv version {{.VERSION}} --frozen
      - uv lock

  release:changelog:
    desc: Generate CHANGELOG.md (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git cliff --tag {{.TAG}} --output CHANGELOG.md

  release:commit:
    desc: Commit version bump and changelog, create annotated tag (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git add pyproject.toml \
                uv.lock \
                CHANGELOG.md
        git commit -m "chore(release): {{.TAG}}"
        git tag -a "{{.TAG}}" -m "Release {{.TAG}}"

  release:push:
    desc: Push commit and tag to origin (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git push origin main
      - git push origin {{.TAG}}

  release:publish:
    desc: Build and publish all workspace packages to PyPI
    cmds:
      - rm -rf dist
      - uv build --all-packages
      - uv publish

  release:github:
    desc: Create GitHub Release with changelog notes (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git cliff --latest --strip all > /tmp/release-notes.md
        gh release create {{.TAG}} \
          --title {{.TAG}} \
          --notes-file /tmp/release-notes.md
