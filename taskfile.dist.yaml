version: "3"

includes:
  sqlalchemy:
    taskfile: packages/milvusql-sqlalchemy/Taskfile.yaml
  django:
    taskfile: packages/milvusql-django/Taskfile.yaml

tasks:
  install:
    desc: Install all workspace dependencies including sub-package groups
    cmds:
      - uv sync --all-groups --all-packages

  # ---------------------------------------------------------------------------
  # Core (src/ + tests/)
  # ---------------------------------------------------------------------------

  core:lint:
    desc: Run linters for the core milvusql package (use CI=true for reports)
    cmds:
      - |
        if [[ "{{.CI}}" == "true" ]]; then
          echo "Running core linters with CI reports..."
          mkdir -p reports
          uv run ruff check --output-format json --output-file reports/ruff.json src tests
          uv run bandit -r src -o reports/bandit.json --format json
          uv run ty check --output-format gitlab > reports/gl-code-quality-report.json
        else
          echo "Running core linters for development..."
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run bandit -r src
          uv run ty check
        fi

  core:test:
    desc: Run core tests (use CI=true for reports)
    env:
      # Each package gets its own coverage DB; `task tests` runs them all
      # in parallel via `deps:` and they'd otherwise collide on one
      # `.coverage` file in the repo root.
      COVERAGE_FILE: "{{.ROOT_DIR}}/.coverage"
    cmds:
      - |
        if [[ "{{.CI}}" == "true" ]]; then
          echo "Running core tests with CI reports..."
          mkdir -p reports
          uv run pytest tests \
            -n {{.CONCURRENCY | default "auto"}} \
            -m "not validation" \
            {{ if .SEED -}}
            --randomly-seed={{.SEED}} \
            {{ end -}}
            {{ if eq .FAILFAST "true" -}}
            -x \
            {{ end -}}
            --junitxml=reports/junit.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing
        else
          echo "Running core tests for development..."
          uv run pytest tests \
            -n {{.CONCURRENCY | default "auto"}} \
            -m "not validation" \
            {{ if .SEED -}}
            --randomly-seed={{.SEED}} \
            {{ end -}}
            {{ if eq .FAILFAST "true" -}}
            -x \
            {{ end -}}
            --cov=src --cov-report=term-missing:skip-covered
        fi

  # ---------------------------------------------------------------------------
  # All packages
  # ---------------------------------------------------------------------------

  lint:
    desc: Run linters for core + all packages (parallel)
    deps: [core:lint, sqlalchemy:lint, django:lint]

  tests:
    desc: Run tests for core + all packages (parallel; use CI=true for reports)
    deps: [core:test, sqlalchemy:test, django:test]

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:version:
    desc: Determine next version via conventional commits
    cmds:
      - |
        NEXT=$(git cliff --bumped-version 2>/dev/null || echo "")
        if [[ -z "$NEXT" ]]; then
          echo "No previous tag found, bootstrapping with v0.1.0"
          NEXT="v0.1.0"
        fi
        NEXT_CLEAN="${NEXT#v}"
        echo "Next version: $NEXT ($NEXT_CLEAN)"
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_CLEAN" >> "$GITHUB_OUTPUT"
        fi

  release:bump:
    desc: Bump version in all packages (requires VERSION=x.y.z)
    requires:
      vars: [VERSION]
    cmds:
      - uv version {{.VERSION}} --frozen
      - uv version {{.VERSION}} --package milvusql-sqlalchemy --frozen
      - uv version {{.VERSION}} --package milvusql-django --frozen
      - uv lock

  release:changelog:
    desc: Generate CHANGELOG.md (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git cliff --tag {{.TAG}} --output CHANGELOG.md

  release:commit:
    desc: Commit version bump and changelog, create annotated tag (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git add pyproject.toml \
                packages/milvusql-sqlalchemy/pyproject.toml \
                packages/milvusql-django/pyproject.toml \
                uv.lock \
                CHANGELOG.md
        git commit -m "chore(release): {{.TAG}}"
        git tag -a "{{.TAG}}" -m "Release {{.TAG}}"

  release:push:
    desc: Push commit and tag to origin (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git push origin main
      - git push origin {{.TAG}}

  release:publish:
    desc: Build and publish all workspace packages to PyPI
    cmds:
      - rm -rf dist
      - uv build --all-packages
      - uv publish

  release:github:
    desc: Create GitHub Release with changelog notes (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git cliff --latest --strip all > /tmp/release-notes.md
        gh release create {{.TAG}} \
          --title {{.TAG}} \
          --notes-file /tmp/release-notes.md
