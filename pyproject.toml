[project]
name = "milvusql"
version = "0.1.0"
description = "PEP 249 DBAPI (sync + async) for Milvus, backed by sqlglot-milvus"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neko1313", email = "nikita.ribalchencko@yandex.ru" }
]
requires-python = ">=3.12"
keywords = ["milvus", "dbapi", "pep249", "vector-search", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pymilvus>=2.6,<3",
    "sqlglot-milvus>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/Callix-Tools/milvusql"
Repository = "https://github.com/Callix-Tools/milvusql"
Issues = "https://github.com/Callix-Tools/milvusql/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# tests/{unit,integration}/<entity>/<action>/ holds act.py (happy-path)
# and error.py (error/edge-case) files rather than test_*.py -- widen
# the collection glob to pick them up alongside the default pattern.
# `errors`'s translate() action has no natural act/error split (every
# test IS about correct error mapping), so it uses descriptive
# scenario files instead -- those need listing too.
python_files = [
    "test_*.py",
    "*_test.py",
    "act.py",
    "error.py",
    "sqlglot_errors.py",
    "milvus_exceptions.py",
    "grpc_errors.py",
    "fallback.py",
]
markers = [
    # `task tests` runs each workspace package through its own pytest
    # invocation (see taskfile's `tests` task for why), so this list only
    # needs the root package's own markers -- milvusql-sqlalchemy/
    # milvusql-django register their own `unit`/`integration`/`validation`
    # + domain marker in their own pyproject.toml, kept in sync by hand.
    "unit: pure-logic test, no external process (Milvus, a real DB) started",
    "integration: exercises a real (embedded) Milvus Lite instance",
    "validation: opt-in test against a real, non-Lite Milvus server (excluded by default -- see taskfile's `-m \"not validation\"`)",
    "dbapi: the root milvusql package's sync/async PEP 249 surface (connection, cursor)",
    "errors: milvusql.dbapi.errors exception translation",
    "translate: milvusql.translate.ast_to_pymilvus's AST -> pymilvus dispatch table",
]

[dependency-groups]
lint = [
    "bandit~=1.8.6",
    "ruff~=0.16.2",
    "ty~=0.0.70",
]
test = [
    "greenlet>=3.5.5",
    "milvus-lite>=2.4,<4",
    "pytest~=8.4.2",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.1.0",
    "pytest-randomly~=4.0.1",
    "pytest-xdist[psutil]~=3.8.0",
]

# Tools settings

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
