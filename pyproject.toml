[project]
name = "milvusql"
version = "0.1.4"
description = "PEP 249 DBAPI (sync + async) for Milvus, backed by sqlglot-milvus"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neko1313", email = "nikita.ribalchencko@yandex.ru" }
]
requires-python = ">=3.12"
keywords = ["milvus", "dbapi", "pep249", "vector-search", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pymilvus>=2.6,<3",
    "sqlglot-milvus>=0.1.0,<0.2",
    # JOIN/GROUP BY/subquery: Milvus reads one collection per RPC and
    # reduces nothing, so those are planned into several fetches plus a
    # client-side evaluation -- `translate/relational.py` runs that on
    # Polars. Imported eagerly, which costs ~140ms next to pymilvus's
    # own ~10s import (measured), so there is nothing to defer.
    "polars>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/Callix-Tools/milvusql"
Repository = "https://github.com/Callix-Tools/milvusql"
Issues = "https://github.com/Callix-Tools/milvusql/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/*",
    "examples/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# tests/{unit,integration}/<entity>/<action>/ holds act.py (happy-path)
# and error.py (error/edge-case) files rather than test_*.py -- widen
# the collection glob to pick them up alongside the default pattern.
# `errors`'s translate() action has no natural act/error split (every
# test IS about correct error mapping), so it uses descriptive
# scenario files instead -- those need listing too.
python_files = [
    "test_*.py",
    "*_test.py",
    "act.py",
    "error.py",
    "sqlglot_errors.py",
    "milvus_exceptions.py",
    "grpc_errors.py",
    "fallback.py",
]
markers = [
    # `task tests` runs each workspace package through its own pytest
    # invocation (see taskfile's `tests` task for why), so this list only
    # needs the root package's own markers -- milvusql-sqlalchemy/
    # milvusql-django register their own `unit`/`integration` + domain
    # marker in their own pyproject.toml, kept in sync by hand.
    "unit: pure-logic test, no external process (Milvus, a real DB) started",
    "integration: exercises a real Milvus server (via testcontainers)",
    "dbapi: the root milvusql package's sync/async PEP 249 surface (connection, cursor)",
    "errors: milvusql.dbapi.errors exception translation",
    "translate: milvusql.translate.ast_to_pymilvus's AST -> pymilvus dispatch table",
]

[dependency-groups]
lint = [
    "bandit~=1.8.6",
    "ruff~=0.16.2",
    "ty~=0.0.70",
]
test = [
    # Cross-process lock so only ONE pytest-xdist worker starts the
    # shared Milvus testcontainer per session -- the standard pattern
    # (see pytest-xdist's own docs) for a session fixture that must run
    # exactly once across every worker, not once per worker. Without
    # this, `-n auto`/`CONCURRENCY>1` starts one full Milvus standalone
    # container (4 CPU/8GB recommended each) per worker concurrently,
    # which reliably OOM-aborts on a normal CI runner.
    "filelock>=3.15",
    "greenlet>=3.5.5",
    # Not used to back any *integration* test anymore (those all run
    # against a real, testcontainers-provisioned Milvus server) -- kept
    # because pymilvus itself requires this package importable just to
    # validate/construct a client for a local ".db"-style URI, which is
    # still a real, documented `milvusql.connect()` mode a handful of
    # unit tests exercise (e.g. async_dbapi's adapter-wrapping test).
    "milvus-lite>=2.4,<4",
    # milvusql-sqlalchemy's own Alembic integration coverage --
    # exercises real `alembic upgrade`/`downgrade` against a real
    # Milvus server through this dialect, not just the underlying
    # SQLAlchemy Core operations Alembic itself compiles to.
    "alembic>=1.13,<2",
    "pytest~=8.4.2",
    "pytest-asyncio~=1.2.0",
    "pytest-cov~=7.1.0",
    "pytest-randomly~=4.0.1",
    "pytest-xdist[psutil]~=3.8.0",
    "testcontainers[milvus]>=4.9.1",
]

# Tools settings

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
