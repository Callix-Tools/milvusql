target-version = "py312"
fix = true
unsafe-fixes = true

[lint]
select = [
    "A",
    "B",
    "F",
    "I",
    "Q",
    "ASYNC",
    "N",
    "W",
    "UP",
    "T20",
    "SIM",
    "ANN",
    "PL",
    "PT",
    "RET",
    "E",
    "S",
    "C4",
    "EM",
    "DTZ",
    "RUF",
    "ARG",
    "TID"
]

[lint.per-file-ignores]
"**/tests/**" = [
    "ANN",
    "D",
    "PLR2004",
    "ARG001",
    "ARG002",
    "E501",
    "S105",
    "B008",
    "ASYNC240",
    "S101",
    "RUF012",
    "S608",
    "S301",
    "PLW1510",
    "PT011",
    "S603",
]
# Every method here overrides a SQLAlchemy Dialect/UserDefinedType or
# Django BaseDatabase* hook -- the signature (including unused
# `connection`/`schema`/`**kw` parameters and `-> t.Any` Comparator
# returns) is dictated by the base class, not a quality issue in this
# code, the same reason sqlglot-milvus's own dialect.py needed exact
# upstream-matching signatures.
"packages/milvusql-sqlalchemy/src/**" = ["ARG002", "ANN401"]
"packages/milvusql-django/src/**" = ["ARG002", "ANN401"]
# A benchmark prints its results (that IS its output channel), seeds a
# non-cryptographic RNG for reproducible data, and interpolates its own
# constant table/limit values into DDL/DQL text.
"benchmarks/**" = ["T20", "S311", "S608", "ANN"]
