[project]
name = "milvusql-django"
version = "0.1.2"
description = "Django database backend for Milvus, built on the milvusql DBAPI"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neko1313", email = "nikita.ribalchencko@yandex.ru" }
]
requires-python = ">=3.12"
keywords = ["milvus", "django", "database-backend", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "milvusql>=0.1.0,<0.2",
    "django>=5,<6",
]

[project.urls]
Homepage = "https://github.com/Callix-Tools/milvusql"
Repository = "https://github.com/Callix-Tools/milvusql"
Issues = "https://github.com/Callix-Tools/milvusql/issues"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
milvusql = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
# tests/{unit,integration}/<entity>/<action>/ holds act.py (happy-path)
# and error.py (error/edge-case) files rather than test_*.py -- widen
# the collection glob to pick them up alongside the default pattern.
python_files = ["test_*.py", "*_test.py", "act.py", "error.py"]
markers = [
    "unit: pure-logic test, no external process (Milvus, a real DB) started",
    "integration: exercises a real Milvus server",
    "django: the milvusql-django backend package",
]
