[project]
name = "milvusql-sqlalchemy"
version = "0.1.3"
description = "SQLAlchemy dialect for Milvus, built on the milvusql DBAPI"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Neko1313", email = "nikita.ribalchencko@yandex.ru" }
]
requires-python = ">=3.12"
keywords = ["milvus", "sqlalchemy", "dialect", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    # NOTE: no "Framework :: SQLAlchemy" -- not a registered PyPI Trove
    # classifier (confirmed directly: PyPI rejected the upload with a 400
    # for it, see https://pypi.org/classifiers/ for the real list).
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "milvusql>=0.1.0,<0.2",
    "sqlalchemy[asyncio]>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Callix-Tools/milvusql"
Repository = "https://github.com/Callix-Tools/milvusql"
Issues = "https://github.com/Callix-Tools/milvusql/issues"

[project.entry-points."sqlalchemy.dialects"]
"milvusql" = "milvusql_sqlalchemy.dialect:MilvusDialect"
"milvusql.aio" = "milvusql_sqlalchemy.dialect:MilvusDialect_aio"

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
milvusql = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
# tests/{unit,integration}/<entity>/<action>/ holds act.py (happy-path)
# and error.py (error/edge-case) files rather than test_*.py -- widen
# the collection glob to pick them up alongside the default pattern.
python_files = ["test_*.py", "*_test.py", "act.py", "error.py"]
# MilvusDialect_aio's own test coverage needs `async def test_...` /
# async fixtures -- mirrors the root package's own pytest-asyncio config.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: pure-logic test, no external process (Milvus, a real DB) started",
    "integration: exercises a real Milvus server",
    "sqlalchemy: the milvusql-sqlalchemy dialect package",
]
