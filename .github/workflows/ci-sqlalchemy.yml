name: "CI: SQLAlchemy"

on:
  pull_request:
    branches: ["*"]
    paths:
      - "packages/milvusql-sqlalchemy/**"
      - "pyproject.toml"
      - "ruff.toml"
      - "ty.toml"
      - "taskfile.dist.yaml"
      - ".github/workflows/ci-sqlalchemy.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-sqlalchemy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task install

      - name: Lint
        run: task sqlalchemy:lint CI=true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task install

      - name: Test
        run: task sqlalchemy:test CI=true CONCURRENCY=4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlalchemy-test-results-py${{ matrix.python-version }}
          path: packages/milvusql-sqlalchemy/reports/
          retention-days: 30
